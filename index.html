<!doctype html>
<html lang="ja" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0a7cff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#150826" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>フライングディスク - ドパ仕様</title>
    <meta
      name="description"
      content="1筆で描いたディスクを、回して飛ばす。形 × 回転 × 勢いで飛距離が決まるブラウザゲーム。スマホもPCもそのまま遊べて、世界ランキングに挑戦できます。"
    />
    <meta property="og:title" content="フライングディスク - ドパ仕様" />
    <meta
      property="og:description"
      content="描いて、回して、飛ばす。形×回転×勢いで決まる飛距離を世界ランキングで競おう。"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* JS 読み込み前のちらつき防止（テーマ色を先に確定させる） */
      html {
        background: #fff8e7;
        color: #1c1030;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #150826;
          color: #fff7e8;
        }
      }
      html[data-theme="light"] {
        background: #fff8e7;
        color: #1c1030;
      }
      html[data-theme="dark"] {
        background: #150826;
        color: #fff7e8;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: 0.1em;
        opacity: 0.55;
      }
    </style>
    <script>
      // テーマは描画前に確定（FOUC 対策）
      try {
        var t = localStorage.getItem("dopa_theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="boot">LOADING…</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
