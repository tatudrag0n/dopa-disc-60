    <!-- 構造化データ（検索結果での見え方） -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "フライングディスク",
        "alternateName": "フライングディスク - ブラウザゲーム",

        "genre": ["カジュアルゲーム", "スコアアタック"],
        "gamePlatform": ["Webブラウザ", "スマートフォン", "PC"],
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "inLanguage": "ja",
        "isAccessibleForFree": true,
        "playMode": "SinglePlayer",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY",
          "availability": "https://schema.org/InStock"
        },
        "publisher": {
          "@type": "Organization",
          "name": "フライングディスク",
          "url": "https://discgame.mct-official.com/"
        }
      }
    </script>

    <style>
      /* JS 読み込み前のちらつき防止（テーマ色を先に確定させる） */
      html {
        background: #fff8e7;
        color: #1c1030;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #150826;
          color: #fff7e8;
        }
      }
      html[data-theme="light"] {
        background: #fff8e7;
        color: #1c1030;
      }
      html[data-theme="dark"] {
        background: #150826;
        color: #fff7e8;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: 0.1em;
        opacity: 0.55;
      }
      /* JS が無効なときの案内 */
      noscript {
        display: block;
        max-width: 42rem;
        margin: 0 auto;
        padding: 2rem 1.25rem;
        font-family: system-ui, sans-serif;
        line-height: 1.9;
      }
      noscript h1 { font-size: 1.4rem; margin-bottom: 0.75rem; }
      noscript h2 { font-size: 1.05rem; margin: 1.25rem 0 0.5rem; }
      noscript ol { padding-left: 1.25rem; }
    </style>
    <script>
      // テーマは描画前に確定（FOUC 対策）
      try {
        var t = localStorage.getItem("dopa_theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="boot">LOADING…</div>
    <noscript>
      <h1>フライングディスク - 1筆で描いて飛ばす無料ブラウザゲーム</h1>
      <p>
        描いた形がそのままディスクになる無料のブラウザゲームです。指やマウスで1筆の円を描き、ディスクを回して勢いをつけ、上へスワイプすると飛びます。飛距離は「形状 × 回転
        × 加速度」で決まり、全国ランキングでほかのプレイヤーと競えます。スマートフォン（iPhone /
        Android）でもパソコンでもインストール不要、ログインなしでそのまま遊べます。
      </p>
      <h2>あそびかた</h2>
      <ol>
        <li>1筆で円盤の形を描きます。円に近いほど高評価になります。</li>
        <li>円盤のまわりを回して回転と勢いをためます。</li>
        <li>勢いが抜ける前に上へスワイプすると発射されます。</li>
      </ol>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
